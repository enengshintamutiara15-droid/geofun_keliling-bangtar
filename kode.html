<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GeoFun — Petualangan Menjelajahi Keliling Bangun Datar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#3b82f6;--green:#22c55e;--yellow:#fbbf24;--pink:#ec4899;--purple:#8b5cf6;--orange:#f97316;--red:#ef4444;--teal:#14b8a6;--ink:#1e2a5a;color-scheme:light;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Baloo 2','Fredoka','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;font-size:17px;line-height:1.45;color:var(--ink);background:#dff3ff;background:linear-gradient(180deg,#bfe9ff 0,#fff3c9 55%,#d5f5c4 100%) fixed}
button{font-family:inherit}
h1,h2,h3,h4,h5,p{margin:0}
ul,ol{margin:6px 0;padding-left:22px}
.hidden{display:none!important}
.guru-only{display:none}
body.guru .guru-only{display:block}
body.guru li.guru-only{display:list-item}
 
/* ===== bilah atas & dock ===== */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:linear-gradient(90deg,#3b82f6,#8b5cf6,#ec4899);color:#fff;box-shadow:0 4px 0 rgba(30,42,90,.2)}
.brand{font-weight:800;font-size:24px;cursor:pointer;display:flex;align-items:center;gap:6px}
.top .grow{flex:1;text-align:center;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:rgba(255,255,255,.25);border:0;color:#fff;border-radius:999px;padding:5px 11px;font-weight:800;font-size:15px;cursor:pointer}
.pill.on{background:#fbbf24;color:#5b3b00}
#view{max-width:980px;margin:0 auto;padding:16px 14px 170px}
body[data-route=cover] .top,body[data-route=cover] .dock,body[data-route=cover] #mascot{display:none}
body[data-route=cover] #view{max-width:none;padding:0}
.dock{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;display:flex;gap:4px;background:#fff;border-radius:30px;padding:6px 8px;border:3px solid #ffd34e;box-shadow:0 6px 0 rgba(30,42,90,.18),0 12px 30px rgba(30,42,90,.2);max-width:calc(100vw - 12px)}
.dock a{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--ink);font-size:11px;font-weight:800;padding:3px 7px;border-radius:20px;min-width:52px}
.dock a .ic{font-size:26px;line-height:1.1}
.dock a:hover .ic{animation:wig .5s}
.dock a.on{background:#fff3b8}
.dock a.on .ic{animation:bounce 1s infinite}
#mascot{position:fixed;left:8px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:flex-end;gap:4px;max-width:78vw;pointer-events:none}
#mascot .mm{width:54px;height:54px;flex:none;pointer-events:auto;cursor:pointer;animation:bounce 2.4s infinite}
#mascot .speech{background:#fff;border:3px solid #34d399;border-radius:16px 16px 16px 4px;padding:6px 10px;font-size:14px;font-weight:700;box-shadow:0 4px 0 rgba(30,42,90,.15);transition:.3s;pointer-events:auto;max-width:260px}
#mascot .speech.off{opacity:0;transform:translateY(8px);pointer-events:none}
 
/* ===== elemen umum ===== */
.btn{border:0;border-radius:999px;padding:9px 18px;font-weight:800;font-size:16px;color:#fff;background:var(--blue);box-shadow:0 5px 0 rgba(0,0,0,.2);cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.go{background:var(--green)}.btn.amber{background:var(--yellow);color:#5b3b00}.btn.gray{background:#94a3b8}.btn.pink{background:var(--pink)}.btn.orange{background:var(--orange)}.btn.purple{background:var(--purple)}.btn.sm{padding:5px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:#fff;border-radius:22px;padding:16px;margin:14px 0;box-shadow:0 6px 0 rgba(30,42,90,.12),0 12px 24px rgba(30,42,90,.08)}
.lead{font-size:18px;font-weight:600;margin:6px 0 10px}
.bubble{position:relative;background:#fff8d6;border:3px solid #fbbf24;border-radius:18px;padding:10px 14px;margin:10px 0;font-weight:700}
.bubble:before{content:"🧑‍🏫 ";}
.pop{animation:pop .35s}
.fig{width:100%;max-width:340px;display:block;margin:6px auto}
.fig .sl{font-size:15px;font-weight:800;fill:#1e2a5a;paint-order:stroke;stroke:#fff;stroke-width:4px}
.fig .sl.q{fill:#dc2626;font-size:20px}
.scene{width:100%;max-width:440px;display:block;margin:8px auto;border-radius:18px}
.calc{background:#eef6ff;border:3px dashed #93c5fd;border-radius:16px;padding:10px 14px;font-weight:800;font-size:18px;margin:8px 0;text-align:center}
.box{background:#dbeafe;border:3px solid #3b82f6;border-radius:16px;padding:12px 16px;font-weight:800;margin:10px 0;font-size:18px}
.box.g{background:#dcfce7;border-color:#22c55e}.box.p{background:#ede9fe;border-color:#8b5cf6}.box.o{background:#ffedd5;border-color:#f97316}.box.y{background:#fef9c3;border-color:#fbbf24}
.tbl{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}
.tbl th{background:#3b82f6;color:#fff;padding:6px}.tbl td{border:2px solid #dbeafe;padding:5px 8px;text-align:center}
.tbl input{width:80px;font:inherit;padding:4px 8px;border:2px solid #93c5fd;border-radius:10px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:#fff;border:3px solid #c7d2fe;border-radius:999px;padding:3px 12px;font-weight:700;font-size:15px}
.chip.btnlike{cursor:pointer}.chip.on{background:#fde68a;border-color:#f59e0b}.chip.ok{background:#bbf7d0;border-color:#22c55e}
.sthead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.sthead h3{font-size:22px}
.tag{background:#ede9fe;color:#6d28d9;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:800}
 
/* ===== tab, flip, opsi, soal ===== */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tab{border:3px solid #c7d2fe;background:#fff;border-radius:999px;padding:5px 14px;font-weight:800;font-size:15px;cursor:pointer;color:var(--ink)}
.tab.on{background:#8b5cf6;border-color:#8b5cf6;color:#fff}
.tabpane{display:none}.tabpane.on{display:block;animation:pop .3s}
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:10px 0}
.flip{perspective:800px;height:150px;cursor:pointer}
.fin{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.flipped .fin{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;font-weight:800;box-shadow:0 5px 0 rgba(30,42,90,.15)}
.ff.front{background:linear-gradient(135deg,#60a5fa,#8b5cf6);color:#fff;font-size:19px}
.ff.back{background:#fef9c3;border:3px solid #fbbf24;transform:rotateY(180deg);font-size:17px}
.mc,.qcard{background:#fff;border-radius:20px;padding:14px;margin:12px 0;box-shadow:0 5px 0 rgba(30,42,90,.12);border:3px solid #e0e7ff}
.mc.done,.qcard.done{border-color:#22c55e;background:#f0fdf4}
.qtext{font-weight:700;margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.opts.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid #c7d2fe;background:#f8fafc;border-radius:16px;padding:8px 12px;font-weight:700;font-size:16px;cursor:pointer;color:var(--ink);text-align:left}
.opt:hover{background:#eef2ff}
.opt.right{background:#bbf7d0;border-color:#22c55e}
.opt.wrong{background:#fecaca;border-color:#ef4444;animation:shake .4s}
.opt svg{width:100%;max-width:200px}
.fb{margin-top:8px;font-weight:700}
.fb.ok{color:#15803d}.fb.bad{color:#b91c1c}
.qcard{display:flex;gap:10px}
.qnum{flex:none;width:34px;height:34px;border-radius:50%;background:#8b5cf6;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.qbody{flex:1;min-width:0}
.qrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.ans{width:130px;font:inherit;font-weight:800;font-size:18px;padding:7px 12px;border:3px solid #93c5fd;border-radius:14px;text-align:center}
.unit{font-weight:800}
.hint{background:#fef9c3;border-radius:12px;padding:6px 10px;margin-top:8px;font-size:15px}
.key{background:#fee2e2;border-radius:12px;padding:6px 10px;margin-top:8px;font-size:14px}
.shake{animation:shake .4s}
 
/* ===== pertemuan ===== */
.hero-t{text-align:center;margin:6px 0 14px}
.hero-t h2{font-size:30px}
.path{display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
.pcard{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:#fff;border-radius:26px;padding:12px 14px;border:4px solid var(--c);box-shadow:0 7px 0 rgba(30,42,90,.14);transition:.15s}
.pcard:nth-child(even){margin-left:28px}.pcard:nth-child(odd){margin-right:28px}
.pcard:hover{transform:translateY(-3px) rotate(-1deg)}
.pnum{flex:none;width:58px;height:58px;border-radius:50%;background:var(--c);color:#fff;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.pcard h3{font-size:19px;line-height:1.15}.pcard small{font-weight:700;opacity:.75}
.pcard .em{margin-left:auto;font-size:34px}
.pdots{display:flex;gap:4px;margin-top:4px}.pdots i{width:14px;height:14px;border-radius:50%;background:#e2e8f0;display:block}.pdots i.on{background:var(--c)}
.phead{display:flex;align-items:center;gap:14px;background:var(--c);color:#fff;border-radius:26px;padding:14px 18px;box-shadow:0 7px 0 rgba(0,0,0,.18)}
.phead h2{font-size:26px;line-height:1.1}.pemoji{font-size:52px}.ptag{font-weight:700;opacity:.9}
.mis ul{margin:4px 0 0}
.track{position:relative;display:flex;justify-content:space-between;gap:4px;margin:26px 0 8px;padding:20px 4px 0}
.track:before{content:"";position:absolute;left:8%;right:8%;top:60px;height:8px;background:repeating-linear-gradient(90deg,#fbbf24 0 12px,transparent 12px 20px);border-radius:4px}
.tn{position:relative;z-index:1;flex:1;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;color:var(--ink);font-weight:800;font-size:12px;padding:0}
.tn span{width:46px;height:46px;border-radius:50%;background:#fff;border:4px solid #c7d2fe;display:flex;align-items:center;justify-content:center;font-size:22px}
.tn.done span{background:#bbf7d0;border-color:#22c55e}
.tn.on span{background:#fde68a;border-color:#f59e0b;transform:scale(1.15)}
.walker{position:absolute;top:-30px;font-size:30px;left:50%;transform:translateX(-50%);animation:hop .8s infinite}
.navrow{display:flex;justify-content:space-between;gap:10px;margin:16px 0}
.guru{border:4px dashed #ec4899}
.guru h5{margin-top:8px;color:#be185d}
.stepbody .lab{border:4px solid #dbeafe}
.lab label{display:flex;align-items:center;gap:8px;font-weight:800;margin:4px 0}
.lab input[type=range]{flex:1;accent-color:#8b5cf6}
.lab label b{min-width:26px;text-align:right}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.moods{display:flex;gap:8px;margin:6px 0}.mood{font-size:30px;border:3px solid transparent;background:#f1f5f9;border-radius:50%;width:52px;height:52px;cursor:pointer}.mood.sel{border-color:#8b5cf6;background:#ede9fe;transform:scale(1.15)}
textarea{width:100%;font:inherit;border:3px solid #c7d2fe;border-radius:14px;padding:8px;min-height:56px}
.slot{display:inline-block;min-width:90px;border-bottom:4px dashed #8b5cf6;text-align:center;font-weight:800;color:#6d28d9}
.wd{margin:3px}.wd:disabled{opacity:.3}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:2px dashed #e2e8f0;padding:6px 0}
.grp b{min-width:130px}.grp .g{border:3px solid #c7d2fe;background:#f8fafc;border-radius:999px;padding:3px 10px;font-weight:700;cursor:pointer;font-size:14px}
.grp.done{background:#f0fdf4}.grp.done .g{display:none}.grp .res{font-weight:800;color:#15803d}
 
/* ===== peta ===== */
.map{position:relative;width:100%;max-width:460px;margin:0 auto;aspect-ratio:400/900;border-radius:30px;overflow:hidden;border:5px solid #fff;box-shadow:0 8px 0 rgba(30,42,90,.18)}
.map>svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-weight:800;color:var(--ink);padding:0;width:120px}
.node .ico{width:74px;height:74px;border-radius:50%;background:var(--c);border:5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 6px 0 rgba(0,0,0,.22)}
.node.open .ico{animation:bounce 1.6s infinite}
.node.locked .ico{background:#94a3b8;filter:grayscale(.6)}
.node .lbl{background:#fff;border-radius:12px;padding:1px 8px;font-size:13px;margin-top:4px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.node .st{font-size:15px;letter-spacing:1px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(30,42,90,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:#f0f9ff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:16px;border-top:8px solid var(--c);animation:up .3s}
.sheet .x{float:right;border:0;background:#ef4444;color:#fff;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer}
.story{background:#fff8d6;border-radius:16px;padding:10px 14px;font-weight:700;margin:8px 0}
.finish{text-align:center;font-size:20px;font-weight:800;padding:12px}
 
/* ===== tusuk gigi ===== */
.tg-wrap{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:860px){.tg-wrap{grid-template-columns:1.5fr 1fr}}
#board{background:#fff7e0;border:5px solid #e6b566;border-radius:22px;padding:6px;touch-action:manipulation}
#board svg{width:100%;height:auto;display:block}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.count{font-size:26px;font-weight:800;text-align:center}
.dot{fill:#a8b3c9}
.stk{animation:pulse .8s infinite}
.mrow{display:flex;gap:6px;flex-wrap:wrap}
 
/* ===== materi ===== */
.mat h4{margin-top:8px}
.mat p{margin:6px 0}
.steps{background:#f8fafc;border-radius:14px;padding:8px 14px;margin:8px 0}
 
/* ===== sampul ===== */
.cover{position:relative;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 14px 200px;text-align:center}
.cover-bg{position:absolute;inset:0;width:100%;height:100%}
.cover>*:not(.cover-bg){position:relative;z-index:2}
.fl{position:absolute!important;z-index:1!important;animation:float 5s ease-in-out infinite}
.ribbon{background:#ec4899;color:#fff;font-weight:800;font-size:22px;padding:6px 26px;border-radius:12px;box-shadow:0 6px 0 rgba(0,0,0,.2);transform:rotate(-2deg)}
.logo{font-size:clamp(72px,17vw,150px);line-height:1;font-weight:800;margin:6px 0;display:flex}
.logo span{display:inline-block;-webkit-text-stroke:10px #fff;paint-order:stroke fill;text-shadow:0 8px 0 rgba(30,42,90,.35);animation:bounce 1.8s infinite}
.banner{background:linear-gradient(90deg,#3b82f6,#8b5cf6);color:#fff;font-weight:800;font-size:clamp(18px,3.4vw,28px);padding:10px 26px;border-radius:18px;border:4px solid #fff;box-shadow:0 7px 0 rgba(30,42,90,.28);max-width:680px}
.start{margin-top:22px;font-size:26px;padding:14px 34px;background:#f97316;animation:pulse 1.4s infinite}
.kids{position:absolute!important;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 6vw;pointer-events:none;z-index:3!important}
.kid{width:clamp(90px,16vw,150px)}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:14px}
.tile{position:relative;overflow:hidden;text-decoration:none;color:#fff;border-radius:28px;padding:16px 18px;min-height:150px;background:var(--c);box-shadow:0 8px 0 rgba(0,0,0,.2);transition:.15s;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;border:0;text-align:left;font-family:inherit}
.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tile h3{font-size:24px;line-height:1.1}.tile p{font-weight:600;opacity:.95}
.tile .big{position:absolute;right:10px;top:4px;font-size:64px;animation:float 4s ease-in-out infinite}
.stat{display:inline-block;background:#fff;border-radius:999px;padding:4px 16px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.conf{position:fixed;top:-40px;z-index:99;pointer-events:none;animation:fall linear forwards}
 
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes hop{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-8px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-16px) rotate(4deg)}}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes dash{to{stroke-dashoffset:-21}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.run{animation:dash 1s linear infinite}
.fig svg,.kid{filter:drop-shadow(0 3px 0 rgba(30,42,90,.15))}
@media(max-width:520px){.pcard:nth-child(even){margin-left:8px}.pcard:nth-child(odd){margin-right:8px}.dock a{min-width:44px;padding:3px 3px}.phead h2{font-size:21px}.pemoji{font-size:40px}.tn small{display:none}}
 
/* ================= LAPISAN WARNA BARU (bentuk & tata letak tetap sama) ================= */
body{background:
  radial-gradient(circle at 8% 6%,rgba(255,150,200,.45) 0,transparent 26%),
  radial-gradient(circle at 94% 14%,rgba(167,139,250,.45) 0,transparent 26%),
  radial-gradient(circle at 12% 92%,rgba(110,231,183,.5) 0,transparent 28%),
  radial-gradient(circle at 92% 88%,rgba(253,224,71,.5) 0,transparent 26%),
  linear-gradient(180deg,#bfe9ff 0,#fff3c9 55%,#d5f5c4 100%) fixed}
#deco{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#deco .dfl{position:absolute;opacity:.5;animation:float 6s ease-in-out infinite}
body[data-route=cover] #deco{display:none}
.top{background:linear-gradient(90deg,#3b82f6,#8b5cf6,#ec4899,#f97316,#fbbf24,#22c55e,#3b82f6);background-size:300% 100%;animation:rainbow 14s linear infinite}
@keyframes rainbow{to{background-position:300% 0}}
.brand{text-shadow:0 2px 0 rgba(30,42,90,.35)}
.btn{background-image:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 60%)}
.dock{background:linear-gradient(180deg,#fffdf0,#fff)}
.dock a .ic{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;font-size:22px}
.dock a:nth-child(1) .ic{background:#fde68a}.dock a:nth-child(2) .ic{background:#bfdbfe}.dock a:nth-child(3) .ic{background:#bbf7d0}.dock a:nth-child(4) .ic{background:#99f6e4}.dock a:nth-child(5) .ic{background:#fed7aa}.dock a:nth-child(6) .ic{background:#fbcfe8}
.card{border-top:8px solid #60a5fa}
#view .card:nth-child(4n+2){border-top-color:#f472b6}#view .card:nth-child(4n+3){border-top-color:#34d399}#view .card:nth-child(4n+4){border-top-color:#fbbf24}
.hero-t h2,.sthead h3{background:linear-gradient(90deg,#3b82f6,#8b5cf6,#ec4899,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:#27357a}

<script>
'use strict';
/* ================= UTIL & STATE ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/"/g,'&quot;');
const view=$('#view');
const KEY='geofun_v1';
let S={levels:{},pt:{},muted:false,guru:false,walk:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
if(!S.walk)S.walk={};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
/* poin: bintang Peta Petualangan + poin Jalan Keliling (1 poin selesai berjalan, 1 poin jawab tantangan) */
const levelStars=()=>Object.values(mapLv()).reduce((a,l)=>a+(l.stars||0),0);
const walkStars=()=>Object.values(S.walk||{}).reduce((a,x)=>a+(x.w?1:0)+(x.q?1:0),0);
const totalStars=()=>levelStars()+walkStars();
 
let AC;
function beep(type){
  if(S.muted)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const notes=type==='ok'?[660,880]:type==='bad'?[240,190]:[520];
    notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type=type==='bad'?'sawtooth':'triangle';g.gain.value=.07;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+i*.12;o.start(t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.stop(t+.17);});
  }catch(e){}
}
function confetti(n=40){
  const emo=['⭐','🎉','🔺','🟦','🟪','🟨','💛','✨','🎈','🟩'];
  for(let i=0;i<n;i++){const d=document.createElement('div');d.className='conf';d.textContent=rnd(emo);d.style.left=Math.random()*100+'vw';d.style.animationDuration=(1.8+Math.random()*1.6)+'s';d.style.animationDelay=Math.random()*.5+'s';d.style.fontSize=(18+Math.random()*22)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),4200);}
}
 
/* ================= SVG HELPERS ================= */
function regPts(n,r,cx,cy,rot=-Math.PI/2){return Array.from({length:n},(_,i)=>[cx+r*Math.cos(rot+2*Math.PI*i/n),cy+r*Math.sin(rot+2*Math.PI*i/n)]);}
function centroid(pts){let x=0,y=0;pts.forEach(p=>{x+=p[0];y+=p[1]});return [x/pts.length,y/pts.length];}
function polyEl(pts,fill,stroke='#1e2a5a',sw=3){return `<polygon points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;}
function fitPts(pts,w,h,pad=44){
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const s=Math.min((w-2*pad)/((maxx-minx)||1),(h-2*pad)/((maxy-miny)||1));
  const ox=(w-(maxx-minx)*s)/2-minx*s, oy=(h-(maxy-miny)*s)/2-miny*s;
  return pts.map(p=>[p[0]*s+ox,p[1]*s+oy]);
}
function sideLabels(pts,texts,off=17){
  let area=0;pts.forEach((p,i)=>{const q=pts[(i+1)%pts.length];area+=p[0]*q[1]-q[0]*p[1];});
  const sg=area>0?1:-1;
  return pts.map((p,i)=>{
    const q=pts[(i+1)%pts.length],dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy)||1;
    const nx=sg>0?dy/L:-dy/L, ny=sg>0?-dx/L:dx/L, m=[(p[0]+q[0])/2,(p[1]+q[1])/2];
    const t=texts[i]; if(t===''||t==null)return '';
    const cls=String(t).startsWith('?')?'sl q':'sl';
    return `<text class="${cls}" x="${(m[0]+nx*off).toFixed(1)}" y="${(m[1]+ny*off+5).toFixed(1)}" text-anchor="middle">${t}</text>`;
  }).join('');
}
function fig(pts,labels,o={}){
  const {w=320,h=200,fill='#bfdbfe',extra=''}=o;
  const P=fitPts(pts,w,h,o.pad||46);
  return `<svg viewBox="0 0 ${w} ${h}" class="fig">${polyEl(P,fill)}${labels?sideLabels(P,labels,17):''}${extra}</svg>`;
}
function rectFig(p,l,u='cm',fill='#bfdbfe'){return fig([[0,0],[p,0],[p,l],[0,l]],[`${p} ${u}`,`${l} ${u}`,`${p} ${u}`,`${l} ${u}`],{fill});}
function regFig(n,s,u='cm',fill='#fde68a',all=true){
  const lab=Array.from({length:n},(_,i)=>(all||i===0)?`${s} ${u}`:'');
  return fig(regPts(n,50,0,0),lab,{fill});
}
function triPts(a,b,c){
  if(a+b<=c||a+c<=b||b+c<=a)return null;
  const x=(b*b+c*c-a*a)/(2*c),y=Math.sqrt(Math.max(0,b*b-x*x));
  return [[0,0],[c,0],[x,-y]];
}
function triSVG(a,b,c,u='cm',fill='#bbf7d0'){
  const P=triPts(a,b,c); if(!P)return '<p class="fb bad">Ukuran itu tidak bisa membentuk segitiga. Coba ubah sisinya!</p>';
  return fig(P,[`${c} ${u}`,`${a} ${u}`,`${b} ${u}`],{fill,h:190});
}
function lPts(W,H,a,b){return [[0,0],[W,0],[W,H-b],[W-a,H-b],[W-a,H],[0,H]];}
function lFig(W,H,a,b,o={}){
  const {unknown=true,wrap=false,u='m'}=o;
  const P=fitPts(lPts(W,H,a,b),340,230,50);
  const lab=[`${W} ${u}`,unknown?'?':`${H-b} ${u}`,`${a} ${u}`,`${b} ${u}`,unknown?'?':`${W-a} ${u}`,`${H} ${u}`];
  let extra='';
  if(wrap){const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]);extra=`<rect x="${Math.min(...xs)}" y="${Math.min(...ys)}" width="${Math.max(...xs)-Math.min(...xs)}" height="${Math.max(...ys)-Math.min(...ys)}" fill="#fde68a" fill-opacity=".45" stroke="#f97316" stroke-width="4" stroke-dasharray="10 7"/>`;}
  return `<svg viewBox="0 0 340 230" class="fig">${extra}${polyEl(P,'#c4b5fd')}${sideLabels(P,lab,18)}</svg>`;
}
function twoRect(a,b,h,u,c1='#93c5fd',c2='#fdba74'){
  const P=fitPts([[0,0],[a+b,0],[a+b,h],[0,h]],320,200,44);
  const x0=P[0][0],x1=P[1][0],y0=P[0][1],y1=P[2][1],xm=x0+(x1-x0)*a/(a+b);
  return `<svg viewBox="0 0 320 200" class="fig"><rect x="${x0}" y="${y0}" width="${xm-x0}" height="${y1-y0}" fill="${c1}" stroke="#1e2a5a" stroke-width="3"/><rect x="${xm}" y="${y0}" width="${x1-xm}" height="${y1-y0}" fill="${c2}" stroke="#1e2a5a" stroke-width="3"/><text class="sl" x="${(x0+xm)/2}" y="${y0-10}" text-anchor="middle">${a} ${u}</text><text class="sl" x="${(xm+x1)/2}" y="${y0-10}" text-anchor="middle">${b} ${u}</text><text class="sl" x="${x0-8}" y="${(y0+y1)/2+5}" text-anchor="end">${h} ${u}</text></svg>`;
}
function lTwo(){ // 6x4 + 3x2 menempel
  const P=fitPts([[0,0],[6,0],[6,6],[0,6]],320,220,40);
  const X=v=>P[0][0]+(P[1][0]-P[0][0])*v/6, Y=v=>P[0][1]+(P[2][1]-P[0][1])*v/6;
  return `<svg viewBox="0 0 320 220" class="fig"><rect x="${X(0)}" y="${Y(0)}" width="${X(6)-X(0)}" height="${Y(4)-Y(0)}" fill="#93c5fd" stroke="#1e2a5a" stroke-width="3"/><rect x="${X(3)}" y="${Y(4)}" width="${X(6)-X(3)}" height="${Y(6)-Y(4)}" fill="#fdba74" stroke="#1e2a5a" stroke-width="3"/><text class="sl" x="${X(3)-30}" y="${Y(2)+5}" text-anchor="middle">6 m × 4 m</text><text class="sl" x="${X(4.5)}" y="${Y(5)+5}" text-anchor="middle">3 m × 2 m</text></svg>`;
}

function mc(q,opts,ok,explain,cls=''){
  return `<div class="mc ${cls}" data-ok="${ok}" data-explain="${esc(explain||'')}"><p class="qtext">${q}</p><div class="opts ${opts.some(o=>o.includes('<svg'))?'grid2':''}">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div><div class="fb"></div></div>`;
}
function numQ(q,i=0){
  return `<div class="qcard" data-ans="${q.ans}" data-tries="0" data-explain="${esc(q.explain||'')}" data-i="${i}"><div class="qnum">${i+1}</div><div class="qbody"><p class="qtext">${q.q}</p>${q.fig?`<div class="qfig">${q.fig}</div>`:''}<div class="qrow"><input class="ans" type="text" inputmode="decimal" placeholder="Jawabanmu" autocomplete="off">${q.unit?`<span class="unit">${q.unit}</span>`:''}<button class="btn go" data-act="check">Cek ✔️</button><button class="btn amber" data-act="hint" title="Petunjuk">💡</button></div><div class="hint hidden">💡 ${q.hint||'Ingat: keliling = jumlah panjang semua sisi terluar.'}</div><div class="fb"></div><div class="key guru-only">🔑 Kunci: <b>${q.ans}${q.unit?' '+q.unit:''}</b>${q.explain?' — '+q.explain:''}</div></div></div>`;
}

  const jb=$('#jbubble');
  if(jb){jb.textContent=msg;jb.classList.remove('pop');void jb.offsetWidth;jb.classList.add('pop');return;}

function fb(box,ok,msg){
  const f=$('.fb',box); f.className='fb '+(ok?'ok':'bad'); f.innerHTML=(ok?'🎉 Benar! ':'🤔 ')+(msg||''); beep(ok?'ok':'bad');
}
function watchDone(root){
  if(root._w)return; root._w=true;
  root.addEventListener('qresult',e=>{
    if(!e.detail.ok)return;
    const all=$$('.qcard,.mc',root); if(all.length&&all.every(x=>x.classList.contains('done'))&&!root._c){root._c=true;confetti(30);say('Semua pos ini selesai! Kamu hebat! 🌟');}
  });
}
document.addEventListener('click',e=>{
  const t=e.target;
  const tab=t.closest('.tab');
  if(tab){const w=tab.closest('.tabwrap');$$(':scope > .tabs > .tab',w).forEach(x=>x.classList.toggle('on',x===tab));$$(':scope > .tabpane',w).forEach(p=>p.classList.toggle('on',p.dataset.p===tab.dataset.t));return;}
  const fl=t.closest('.flip'); if(fl){fl.classList.toggle('flipped');return;}
  const md=t.closest('.mood'); if(md){$$('.mood',md.parentElement).forEach(x=>x.classList.toggle('sel',x===md));return;}
  const opt=t.closest('.opt');
  if(opt){
    const box=opt.closest('.mc'); if(!box||box.classList.contains('done'))return;
    const ok=+box.dataset.ok,i=+opt.dataset.i,good=ok<0||i===ok;
    if(good){opt.classList.add('right');box.classList.add('done');$$('.opt',box).forEach(b=>b.disabled=true);fb(box,true,box.dataset.explain);}
    else{opt.classList.add('wrong');opt.disabled=true;fb(box,false,'Belum tepat, coba pilihan lain ya! 💪');}
    box.dispatchEvent(new CustomEvent('qresult',{bubbles:true,detail:{ok:good}}));return;
  }
  const b=t.closest('[data-act]');
  if(b){
    const card=b.closest('.qcard');
    if(b.dataset.act==='hint'){$('.hint',card).classList.toggle('hidden');return;}
    if(b.dataset.act==='check')checkNum(card);
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('ans')&&e.target.closest('.qcard')){checkNum(e.target.closest('.qcard'));}});
function checkNum(card){
  if(!card||card.classList.contains('done'))return;
  const inp=$('.ans',card),v=parseFloat(String(inp.value).replace(',','.'));
  if(isNaN(v)){fb(card,false,'Tulis angkanya dulu ya ✏️');$('.fb',card).classList.replace('ok','bad');return;}
  const ok=Math.abs(v-parseFloat(card.dataset.ans))<1e-9;
  if(ok){card.classList.add('done');inp.disabled=true;$('[data-act=check]',card).disabled=true;fb(card,true,card.dataset.explain);}
  else{card.dataset.tries=+card.dataset.tries+1;fb(card,false,'Belum tepat. Hitung lagi ya, atau ketuk 💡.');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');}
  card.dispatchEvent(new CustomEvent('qresult',{bubbles:true,detail:{ok,i:+card.dataset.i}}));
}

    $('#triLog',r).onclick=()=>{const a=+ta.value,b=+tb.value,c=+tc.value,i=info(a,b,c);kinds.add(i.k);const tr=document.createElement('tr');tr.innerHTML=`<td>${i.k}</td><td>${a}, ${b}, ${c}</td><td>${i.sum} cm</td><td>${i.cara}</td>`;$('#triTb',r).appendChild(tr);beep('ok');
      if(kinds.size===3){$('#triFb',r).className='fb ok';$('#triFb',r).textContent='🎉 Kamu sudah menyelidiki ketiga jenis segitiga! Lanjut ke pos Cek ✅';}};
    const ss=$('#ss',r);const us=()=>{const s=+ss.value;$('#ssv',r).textContent=s;$('#ssInfo',r).innerHTML=`Cara 1: ${s} + ${s} + ${s} = ${3*s}<br>Cara 2: ${s} × 3 = ${3*s}<br>✅ Hasilnya sama!`;};ss.oninput=us;us();upd();}},
 {t:'Cek temuanmu',say:'Periksa temuanmu dengan soal-soal ini! ✅',
  h:()=>`${mc('Segitiga sama sisi bersisi 8 cm. Cara yang benar untuk mencari keliling:',['8 + 8 + 8','8 × 3','Keduanya benar'],2,'Menjumlahkan tiga kali sama saja dengan mengalikan 3. Keduanya sah!')}${mc('Segitiga sama kaki dengan kaki 6 cm dan alas 8 cm. Kelilingnya…',['6 + 8 = 14 cm','(2 × 6) + 8 = 20 cm','3 × 6 = 18 cm'],1,'Ada dua kaki (6 cm) ditambah alas 8 cm.')}${mc('Segitiga sembarang sisinya 9, 6, dan 8 cm. Cara menghitung kelilingnya…',['3 × 9','9 + 6 + 8','2 × (9 + 6)'],1,'Sisinya berbeda semua, jadi dijumlahkan satu per satu.')}`},

 {t:'Latihan mandiri',say:'Tiga soal segitiga menantimu! 🏆',

3:()=>[
 {t:'Kenali segi empat',say:'Tujuh segi empat siap kamu amati! 👀',
  h:()=>`<p class="lead">Amati tujuh segi empat berikut lengkap dengan ukuran sisinya.</p><div class="flips" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${Q4.map(s=>{const p={};s.P.forEach(x=>p[x[0]]=x[4]);const pts=s.pts(p);return `<div class="card" style="margin:0;padding:8px;text-align:center"><b>${s.n}</b>${fig(pts,s.lab(p).map(v=>v),{fill:s.c,w:200,h:150,pad:34})}</div>`;}).join('')}</div>
  ${mc('Bangun mana yang semua sisinya sama panjang?',['Persegi dan belah ketupat','Persegi panjang dan jajargenjang','Trapesium dan layang-layang'],0,'Persegi dan belah ketupat punya empat sisi sama panjang.')}
  ${mc('Bangun mana yang punya dua pasang sisi sama panjang, tetapi tidak semuanya sama?',['Persegi panjang, jajargenjang, layang-layang','Persegi dan belah ketupat','Trapesium saja'],0,'Ketiganya punya dua pasang sisi yang sama panjang.')}

  h:()=>`<div class="bubble">Bangun mana yang punya sepasang atau dua pasang sisi sama panjang? Bangun mana yang semua sisinya sama? Bangun mana yang sisinya berbeda-beda?</div>${mc('Pertanyaan pemantik manakah yang paling cocok untuk pelajaran hari ini?',['Bagaimana cara paling efisien menghitung keliling tiap jenis segi empat berdasarkan kesamaan panjang sisinya?','Bangun mana yang paling cantik?','Berapa jumlah sudut persegi?'],0,'Kita akan mencari cara paling efisien untuk tiap kelompok bangun.')}`},
 {t:'Laboratorium segi empat',say:'Pilih bangun, geser ukurannya, temukan caranya! 🔬',
  h:()=>`<div class="card lab"><div class="chips" id="q4chips">${Q4.map((s,i)=>`<button class="chip btnlike ${i?'':'on'}" data-i="${i}">${s.n}</button>`).join('')}</div><div id="q4sl"></div><div id="q4svg"></div><div class="calc" id="q4calc"></div><div class="box y" id="q4note"></div></div><div class="card"><b>📋 Tabel Rangkuman (terisi saat kamu mencoba tiap bangun)</b><table class="tbl"><thead><tr><th>Bangun</th><th>Banyak sisi</th><th>Cara mencari keliling</th></tr></thead><tbody id="q4tb"></tbody></table></div>`,
  m:r=>{let cur=0;const vis=new Set([Q4[0].id]);
    const vals=()=>{const o={};$$('#q4sl input',r).forEach(i=>{o[i.dataset.k]=+i.value;i.nextElementSibling.textContent=i.value;});return o;};
    function table(){$('#q4tb',r).innerHTML=Q4.map(s=>`<tr><td>${s.n}</td><td>4</td><td>${vis.has(s.id)?'<b>'+s.cara+'</b>':'❓'}</td></tr>`).join('');}
    function upd(){const s=Q4[cur],p=vals(),pts=s.pts(p);
      if(!pts){$('#q4svg',r).innerHTML='<p class="fb bad">Sisi-sisi itu tidak bisa menutup menjadi trapesium. Ubah ukurannya ya!</p>';$('#q4calc',r).textContent='';return;}
      $('#q4svg',r).innerHTML=fig(pts,s.lab(p).map(v=>v+' cm'),{fill:s.c,h:210});
      const [ex,tot]=s.how(p);$('#q4calc',r).innerHTML=`Keliling = ${ex} = <b>${tot} cm</b>`;
      $('#q4note',r).textContent=[ 'Keempat sisinya sama panjang, jadi cukup dikalikan 4.','Ada dua pasang sisi yang sama panjang, jumlahkan sepasang lalu kalikan 2.','Tidak ada sisi yang pasti sama panjang, jadi jumlahkan keempat sisinya satu per satu.'][s.g]+(s.id==='sm'?' (Gambar tidak sesuai skala.)':'');
      vis.add(s.id);table();}
    function build(){const s=Q4[cur];$('#q4sl',r).innerHTML=s.P.map(p=>`<label>${p[1]} <input type="range" data-k="${p[0]}" min="${p[2]}" max="${p[3]}" value="${p[4]}"><b>${p[4]}</b></label>`).join('');$$('#q4sl input',r).forEach(i=>i.oninput=upd);upd();}
    $$('#q4chips .chip',r).forEach(c=>c.onclick=()=>{cur=+c.dataset.i;$$('#q4chips .chip',r).forEach(x=>x.classList.toggle('on',x===c));build();});
    build();}},
 {t:'Kelompokkan bangunnya',say:'Pasangkan bangun dengan cara menghitungnya! 🧩',
  h:()=>`<p class="lead">Untuk tiap bangun, pilih cara menghitung keliling yang paling efisien.</p><div class="card" id="grpbox">${[...Q4].sort(()=>Math.random()-.5).map(s=>`<div class="grp" data-g="${s.g}"><b>${s.n}</b>${GRP.map((g,i)=>`<button class="g" data-g="${i}">${g}</button>`).join('')}<span class="res"></span></div>`).join('')}</div><div class="fb" id="grpfb"></div>`,
  m:r=>{r.querySelector('#grpbox').addEventListener('click',e=>{const b=e.target.closest('.g');if(!b)return;const row=b.closest('.grp');
    if(b.dataset.g===row.dataset.g){row.classList.add('done');$('.res',row).textContent='✅ '+GRP[+row.dataset.g];beep('ok');
      if($$('.grp',r).every(x=>x.classList.contains('done'))){$('#grpfb',r).className='fb ok';$('#grpfb',r).textContent='🎉 Semua bangun terkelompok dengan benar!';confetti();}}
    else{beep('bad');row.classList.remove('shake');void row.offsetWidth;row.classList.add('shake');}});}},
 {t:'Rumus segi empat',say:'Semua rumus ada di kartu ini! 🔄',

    {q:'Sebuah trapesium bersisi 8 cm, 6 cm, 10 cm, dan 7 cm. Berapa kelilingnya?',ans:31,unit:'cm',explain:'8 + 6 + 10 + 7 = 31 cm.'}

 {t:'Kenali segi banyak',say:'Hitung sisinya dan ingat rumus persegi! 🐝',

5:()=>[
 {t:'Amati denah rumah',say:'Denah ini tersusun dari banyak ruangan! 🏠',
  h:()=>`<p class="lead">Lihat denah rumah dari atas. Rumah ini tersusun dari beberapa ruangan.</p><svg viewBox="0 0 400 260" class="scene"><rect width="400" height="260" fill="#fef3c7"/><g stroke="#7c2d12" stroke-width="4"><rect x="40" y="30" width="180" height="100" fill="#93c5fd"/><rect x="220" y="30" width="140" height="100" fill="#fca5a5"/><rect x="40" y="130" width="100" height="100" fill="#86efac"/><rect x="140" y="130" width="80" height="100" fill="#fde68a"/></g><g font-weight="800" font-size="14" text-anchor="middle" fill="#1e2a5a"><text x="130" y="85">Ruang Tamu</text><text x="290" y="85">Kamar Tidur</text><text x="90" y="185">Dapur</text><text x="180" y="185">Kamar Mandi</text></g></svg>${mc('Denah rumah ini tersusun dari gabungan bangun…',['Persegi dan persegi panjang','Lingkaran','Segitiga saja'],0,'Setiap ruangan berbentuk persegi atau persegi panjang.')}<div class="bubble">Bagaimana cara mengetahui panjang seluruh dinding terluar rumah ini jika hanya sebagian ukuran ruangan yang diketahui?</div>`},
 {t:'Rumuskan pertanyaan',say:'Apa yang belum kita ketahui? ❓',
  h:()=>`${mc('Pertanyaan yang paling tepat untuk pelajaran ini adalah…',['Bagaimana cara menentukan keliling bangun gabungan, termasuk mencari sisi-sisi yang belum diketahui ukurannya?','Berapa harga rumah itu?','Ada berapa pintu di rumah itu?'],0,'Itulah misi kita hari ini!')}`},
 {t:'Laboratorium bangun L',say:'Cari sisi yang hilang, lalu jumlahkan! 🔬',
  h:()=>`<div class="card lab">${sl('lw','Lebar total W (m)',8,14,10)}${sl('lh','Tinggi total H (m)',6,12,7)}${sl('la','Lebar takik a (m)',2,5,4)}${sl('lb','Tinggi takik b (m)',2,4,3)}<div id="lSvg"></div>
  <p class="lead"><b>Strategi A:</b> telusuri sisi terluar. Isi dua sisi yang bertanda <b style="color:#dc2626">?</b></p><div class="qrow">Sisi kanan: <input class="ans" id="uR" inputmode="numeric"> m &nbsp; Sisi bawah: <input class="ans" id="uB" inputmode="numeric"> m <button class="btn go" id="uChk">Cek ✔️</button></div><div class="fb" id="uFb"></div><div class="calc hidden" id="uSum"></div>
  <p class="lead" style="margin-top:12px"><b>Strategi B:</b> bungkus dengan persegi panjang besar.</p><button class="btn orange" id="wrapBtn">📦 Bungkus bangunnya</button><div class="calc hidden" id="wrapTxt"></div></div>`,
  m:r=>{let wrap=false;const g=id=>+$('#'+id,r).value;
    function draw(){const W=g('lw'),H=g('lh'),a=g('la'),b=g('lb');['lw','lh','la','lb'].forEach(i=>$('#'+i+'v',r).textContent=g(i));
      $('#lSvg',r).innerHTML=lFig(W,H,a,b,{unknown:!$('#uSum',r).dataset.ok,wrap});}
    function reset(){$('#uR',r).value='';$('#uB',r).value='';$('#uFb',r).textContent='';$('#uSum',r).classList.add('hidden');delete $('#uSum',r).dataset.ok;wrap=false;$('#wrapTxt',r).classList.add('hidden');draw();}
    ['lw','lh','la','lb'].forEach(i=>$('#'+i,r).oninput=reset);
    $('#uChk',r).onclick=()=>{const W=g('lw'),H=g('lh'),a=g('la'),b=g('lb'),R=parseFloat($('#uR',r).value),B=parseFloat($('#uB',r).value),f=$('#uFb',r);
      if(R===H-b&&B===W-a){f.className='fb ok';f.innerHTML='🎉 Tepat! Sisi kanan = H − b, sisi bawah = W − a.';const s=$('#uSum',r);s.dataset.ok=1;s.classList.remove('hidden');s.innerHTML=`Keliling = ${W} + ${R} + ${a} + ${b} + ${B} + ${H} = <b>${W+R+a+b+B+H} m</b>`;beep('ok');confetti(20);draw();}
      else{f.className='fb bad';f.textContent='Belum tepat. Petunjuk: sisi kanan + takik b = tinggi total H; sisi bawah + takik a = lebar total W.';beep('bad');}};
    $('#wrapBtn',r).onclick=()=>{wrap=!wrap;const W=g('lw'),H=g('lh'),t=$('#wrapTxt',r);t.classList.toggle('hidden',!wrap);t.innerHTML=`Persegi panjang pembungkus ${W} m × ${H} m → keliling = 2 × (${W} + ${H}) = <b>${2*(W+H)} m</b><br>Sama dengan Strategi A! ✅`;draw();};
    draw();}},
 {t:'Cek strategimu',say:'Awas sisi yang berimpit! ⚠️',
  h:()=>`<p class="lead">Sebuah taman berbentuk gabungan persegi (sisi 6 m) dan segitiga sama sisi (sisi 6 m) yang menempel pada satu sisi persegi.</p>${houseFig(6)}
   ${mc('Sisi persegi yang menempel dengan segitiga (garis merah putus-putus) ikut dijumlahkan?',['Ya, semua sisi dijumlahkan','Tidak, karena berada di dalam, bukan sisi terluar'],1,'Sisi yang berimpit ada di dalam sehingga bukan bagian dari keliling.')}

function viewTusuk(FP){FP=FP||0;

  ];
  const PTM=[[1,3],[1,3],[1,3],[5],[2],[3],[3],[3],[4]];MS.forEach((m,i)=>m.pt=PTM[i]);
  const NM={5:'lima',6:'enam',7:'tujuh',8:'delapan',9:'sembilan',10:'sepuluh'};
  view.innerHTML=`<div class="hero-t"><h2>🥢 Lab Tusuk Gigi</h2><p class="lead">1 tusuk gigi = 1 cm. Ketuk dua titik untuk memasang tusuk gigi. Tutup menjadi sebuah bangun, lalu temukan cara menghitung kelilingnya!</p></div>
  <div class="tg-wrap"><div>
   <div class="tools"><button class="btn sm" id="mSq">▦ Papan Kotak</button><button class="btn sm gray" id="mTri">△ Papan Segitiga</button><button class="btn sm go" id="tPut">✏️ Pasang</button><button class="btn sm gray" id="tDel">🧽 Hapus</button><button class="btn sm amber" id="tUndo">↩️ Urungkan</button><button class="btn sm pink" id="tClr">🗑️ Bersihkan</button></div>
   <div id="board"></div></div>
   <div>
    <div class="card"><div class="count" id="cnt"></div><div id="res"></div></div>
    <div class="card"><b>🎯 Misi Tusuk Gigi</b><div class="chips" id="mch">${MS.map((m,i)=>(FP&&!m.pt.includes(FP))?'':`<button class="chip btnlike" data-i="${i}">P${m.pt.join('/')} · ${i+1} ${m.b==='sq'?'▦':'△'}</button>`).join('')}</div><p class="tiny">${FP?'Misi Pertemuan '+FP+'. <a href="#/tusuk">Lihat semua misi</a>':'Kode P = pertemuan tempat bangun itu dipelajari.'}</p><div class="box y" id="mtxt">Pilih nomor misi, atau bebas berkreasi!</div></div>
    <div class="card"><b>📒 Buku Penemuan</b><table class="tbl"><thead><tr><th>Bangun</th><th>Sisi</th><th>Keliling</th></tr></thead><tbody id="nb"><tr><td colspan="3">Belum ada catatan</td></tr></tbody></table><p><small>Bandingkan catatanmu: adakah pola antara panjang sisi dan jumlah tusuk gigi?</small></p></div>
    <div class="card guru-only guru"><b>🧑‍🏫 Catatan Guru</b><p>Gunakan pada tahap Data Collection: minta murid membuat persegi bersisi 1, 2, 3 lalu membandingkan jumlah tusuk gigi (4 × sisi); persegi panjang yang berbeda tetapi kelilingnya sama; dan bentuk L untuk bangun gabungan. Papan Segitiga memungkinkan jajargenjang, belah ketupat, trapesium, dan segi enam beraturan.</p></div>
   </div></div>`;
  const board=$('#board');
  const dirOK=(di,dj)=>!(di===0&&dj===0)&&(di===0||dj===0||(T.mode==='tri'&&di===-dj));
  const ek=(a,b)=>[a.join(','),b.join(',')].sort().join('|');
  const cart=(i,j)=>T.mode==='sq'?[i,j]:[i+j/2,j*.866];
  function pts(){const r=[];for(let j=0;j<8;j++){if(T.mode==='sq'){for(let i=0;i<11;i++)r.push([i,j]);}else{const i0=-Math.floor(j/2);for(let k=0;k<10;k++)r.push([i0+k,j]);}}return r;}
  function draw(){
    const ps=pts(),set=new Set(ps.map(p=>p.join(','))),dirs=T.mode==='sq'?[[1,0],[0,1]]:[[1,0],[0,1],[-1,1]];
    const P=(i,j)=>T.mode==='sq'?[PAD+i*U,PAD+j*U]:[PAD+(i+j/2)*U,PAD+j*U*.866];
    let W=0,H=0,grid='',dots='',hit='',edges='';
    ps.forEach(([i,j])=>{const a=P(i,j);W=Math.max(W,a[0]+PAD);H=Math.max(H,a[1]+PAD);
      dirs.forEach(([di,dj])=>{if(set.has((i+di)+','+(j+dj))){const b=P(i+di,j+dj);grid+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#eadfc4" stroke-width="2"/>`;}});
      dots+=`<circle class="dot" cx="${a[0]}" cy="${a[1]}" r="5"/>`;hit+=`<circle data-p="${i},${j}" cx="${a[0]}" cy="${a[1]}" r="18" fill="transparent" style="cursor:pointer"/>`;});
    T.edges.forEach(k=>{const [a,b]=k.split('|').map(s=>s.split(',').map(Number)),A=P(...a),B=P(...b),dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,x1=A[0]+ux*4,y1=A[1]+uy*4,x2=B[0]-ux*4,y2=B[1]-uy*4;
      edges+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#a86b1f" stroke-width="12" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#f4c56a" stroke-width="8" stroke-linecap="round"/><line x1="${x1+uy*2}" y1="${y1-ux*2}" x2="${x2+uy*2}" y2="${y2-ux*2}" stroke="#fde7b0" stroke-width="2" stroke-linecap="round"/>`;});
    let st='';if(T.start){const a=P(...T.start);st=`<circle class="stk" cx="${a[0]}" cy="${a[1]}" r="13" fill="none" stroke="#ef4444" stroke-width="4"/>`;}
    board.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${grid}${dots}${edges}${st}${hit}</svg>`;
  }
  function analyze(){
    const E=[...T.edges];if(!E.length)return {st:'empty'};
    const adj=new Map(),add=(a,b)=>{if(!adj.has(a))adj.set(a,[]);adj.get(a).push(b);};
    E.forEach(k=>{const [a,b]=k.split('|');add(a,b);add(b,a);});
    let open=0,br=0;adj.forEach(v=>{if(v.length===1)open++;else if(v.length>2)br++;});
    if(br)return {st:'branch'};if(open)return {st:'open',open};
    const start=adj.keys().next().value;let prev=null,cur=start;const order=[];
    for(let n=0;n<=adj.size+1;n++){order.push(cur);const nb=adj.get(cur),nx=nb[0]===prev?nb[1]:nb[0];prev=cur;cur=nx;if(cur===start)break;}
    if(order.length!==adj.size)return {st:'multi'};
    const Pc=order.map(k=>{const [i,j]=k.split(',').map(Number);return cart(i,j);}),N=Pc.length,C=[];
    for(let k=0;k<N;k++){const a=Pc[(k-1+N)%N],b=Pc[k],c=Pc[(k+1)%N],v1=[b[0]-a[0],b[1]-a[1]],v2=[c[0]-b[0],c[1]-b[1]];if(Math.abs(v1[0]*v2[1]-v1[1]*v2[0])>1e-6)C.push(b);}
    const n=C.length;if(n<3)return {st:'multi'};
    const V=C.map((c,k)=>{const d=C[(k+1)%n];return [d[0]-c[0],d[1]-c[1]];}),L=V.map(v=>Math.round(Math.hypot(v[0],v[1])));
    const turn=V.map((v,k)=>{const w=V[(k+1)%n];return Math.atan2(v[0]*w[1]-v[1]*w[0],v[0]*w[0]+v[1]*w[1])*180/Math.PI;});
    const o=Math.sign(turn.reduce((a,b)=>a+b,0)),A=turn.map(t=>Math.round(180-o*t));
    const eq=L.every(x=>x===L[0]),allR=A.every(a=>a===90),convex=A.every(a=>a<180),par=(i,j)=>Math.abs(V[i][0]*V[j][1]-V[i][1]*V[j][0])<1e-6;
    let kind;
    if(n===3)kind=eq?'Segitiga sama sisi':(L[0]===L[1]||L[1]===L[2]||L[0]===L[2])?'Segitiga sama kaki':'Segitiga sembarang';
    else if(n===4){const opp=L[0]===L[2]&&L[1]===L[3],adjE=(L[0]===L[1]&&L[2]===L[3])||(L[1]===L[2]&&L[3]===L[0]);
      kind=!convex?'Segi empat sembarang':eq?(allR?'Persegi':'Belah ketupat'):opp?(allR?'Persegi panjang':'Jajargenjang'):adjE?'Layang-layang':(par(0,2)||par(1,3))?'Trapesium':'Segi empat sembarang';}
    else{if(A.every(a=>a===90||a===270)&&!convex)kind='Bangun gabungan (bentuk L/T dan sejenisnya)';
      else if(convex&&eq&&A.every(a=>a===A[0]))kind=`Segi ${NM[n]||n} beraturan`;
      else kind=`Segi ${NM[n]||n} tidak beraturan`;}
    return {st:'closed',kind,L,n,perim:E.length};
  }
  function cara(r){const {kind,L,perim:P}=r;
    if(kind==='Persegi'||kind==='Belah ketupat')return `4 × ${L[0]} = ${P}`;
    if(kind==='Persegi panjang'||kind==='Jajargenjang')return `2 × (${L[0]} + ${L[1]}) = ${P}`;
    if(kind==='Layang-layang'){const a=L[0]===L[1]?L[0]:L[1],b=L[0]===L[1]?L[2]:L[3];return `2 × (${a} + ${b}) = ${P}`;}
    if(kind==='Segitiga sama sisi')return `3 × ${L[0]} = ${P}`;
    if(kind==='Segitiga sama kaki'){const leg=L[0]===L[1]?L[0]:(L[1]===L[2]?L[1]:L[0]),base=L[0]===L[1]?L[2]:(L[1]===L[2]?L[0]:L[1]);return `(2 × ${leg}) + ${base} = ${P}`;}
    if(kind.includes('beraturan')&&!kind.includes('tidak'))return `${L.length} × ${L[0]} = ${P}`;
    return L.join(' + ')+' = '+P;
  }
  let last=null;
  function refresh(){
    $('#cnt').innerHTML=`🥢 × <b>${T.edges.size}</b><br><small>tusuk gigi terpasang</small>`;
    const r=analyze();last=r;const box=$('#res');
    if(r.st==='empty')box.innerHTML='<p>Papan masih kosong. Ketuk sebuah titik untuk memulai!</p>';
    else if(r.st==='open')box.innerHTML=`<p>🔓 Bangunmu belum tertutup (ada ${r.open} ujung terbuka). Sambungkan sampai kembali ke titik awal.</p>`;
    else if(r.st==='branch')box.innerHTML='<p>🌿 Ada tusuk gigi yang bercabang. Satu titik hanya boleh disambung dua tusuk gigi.</p>';
    else if(r.st==='multi')box.innerHTML='<p>🧩 Ada lebih dari satu bangun. Buat satu bangun dulu ya.</p>';
    else{box.innerHTML=`<div class="box g">🎯 Bangunmu: <b>${r.kind}</b><br>Panjang sisi: ${r.L.join(', ')} cm<br>Keliling = <b>${r.perim} cm</b> (${r.perim} tusuk gigi)<br>Cara cepat: ${cara(r)}</div><button class="btn go" id="logBtn">📝 Catat di Buku Penemuan</button>`;
      $('#logBtn').onclick=()=>{T.notes.push([r.kind,r.L.join(', '),r.perim+' cm ('+cara(r).split(' = ')[0]+')']);beep('ok');renderNotes();};
      say(`Wah, kamu membuat ${r.kind.toLowerCase()}! 🎉`);
      if(T.mission>=0&&MS[T.mission].ok(r)&&!T.done.has(T.mission)){T.done.add(T.mission);grpAdd(1);confetti(40);beep('ok');mission();say('Misi selesai! Hebat! 🏆');}}
  }
  function renderNotes(){$('#nb').innerHTML=T.notes.length?T.notes.map(n=>`<tr><td>${n[0]}</td><td>${n[1]}</td><td>${n[2]}</td></tr>`).join(''):'<tr><td colspan="3">Belum ada catatan</td></tr>';}
  function mission(){
    $$('#mch .chip').forEach(c=>{const j=+c.dataset.i;c.classList.toggle('on',j===T.mission);c.classList.toggle('ok',T.done.has(j));});
    $('#mtxt').innerHTML=T.mission<0?'Pilih nomor misi, atau bebas berkreasi!':(T.done.has(T.mission)?'✅ Misi selesai! ':'')+MS[T.mission].t;
  }
  const snap=()=>T.hist.push([...T.edges]);
  function setMode(m,keep){T.mode=m;if(!keep){T.edges.clear();T.hist=[];}T.start=null;$('#mSq').classList.toggle('gray',m!=='sq');$('#mTri').classList.toggle('gray',m!=='tri');draw();refresh();}
  board.onclick=e=>{
    const c=e.target.closest('[data-p]');if(!c)return;const p=c.dataset.p.split(',').map(Number);
    if(!T.start){T.start=p;draw();return;}
    if(T.start[0]===p[0]&&T.start[1]===p[1]){T.start=null;draw();return;}
    const di=p[0]-T.start[0],dj=p[1]-T.start[1];
    if(!dirOK(di,dj)){say('Tusuk gigi harus lurus mengikuti garis kisi ya! 🥢');beep('bad');T.start=p;draw();return;}
    const k=Math.max(Math.abs(di),Math.abs(dj)),si=di/k,sj=dj/k;snap();
    for(let t=0;t<k;t++){const key=ek([T.start[0]+si*t,T.start[1]+sj*t],[T.start[0]+si*(t+1),T.start[1]+sj*(t+1)]);if(T.erase)T.edges.delete(key);else T.edges.add(key);}
    beep('tick');T.start=p;draw();refresh();
  };
  $('#mSq').onclick=()=>setMode('sq');$('#mTri').onclick=()=>setMode('tri');
  $('#tPut').onclick=()=>{T.erase=false;$('#tPut').classList.remove('gray');$('#tDel').classList.add('gray');};
  $('#tDel').onclick=()=>{T.erase=true;$('#tDel').classList.remove('gray');$('#tPut').classList.add('gray');};
  $('#tUndo').onclick=()=>{if(T.hist.length){T.edges=new Set(T.hist.pop());T.start=null;draw();refresh();}};
  $('#tClr').onclick=()=>{if(T.edges.size){snap();T.edges.clear();T.start=null;draw();refresh();}};
  $$('#mch .chip').forEach(c=>c.onclick=()=>{const i=+c.dataset.i;T.mission=i;setMode(MS[i].b);mission();});
  setMode('sq');mission();renderNotes();
}

const WALKSHAPES=[

    if(b.dataset.add){const v=$('#gname',box).value.trim();setAct(addGroup(v||undefined));}
    else if(b.dataset.g)setAct(b.dataset.g);else return;
    draw();if(cb)cb();};
}
const rankHTML=c=>c.length?[...c].sort((a,b)=>(b.stars||0)-(a.stars||0)).map((g,i)=>`<div class="grp"><b>${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${hh(g.name)}</b><span class="chip">⭐ ${g.stars||0}</span></div>`).join(''):'<p class="tiny">Belum ada kelompok. Tambahkan kelompok di atas.</p>';
 
/* ===== kesimpulan bersama (Pertemuan 1) ===== */
function defStep(r){
  clearInterval(window._tm);
  const D=()=>ldJ(DK,{});
  const auto=t=>{t=t.toLowerCase();return /jumlah|total|tambah/.test(t)&&/sisi|tepi|pinggir|garis/.test(t);};
  function draw(){
    if(!$('#dbd')){clearInterval(window._tm);return;}
    const c=loadC(),d=D();
    $('#dbd').innerHTML=c.filter(g=>d[g.id]).map(g=>{
      const x=d[g.id],v=x.v||{},up=Object.values(v).filter(z=>z>0).length,dn=Object.values(v).filter(z=>z<0).length,mine=v[ACT],own=g.id===ACT;
      const vd=up+dn===0?'⏳ Menunggu penilaian':up>dn?'✅ Dinilai BENAR':up<dn?'❌ Dinilai KURANG TEPAT':'🤝 Seimbang, diskusikan!';
      return `<div class="card" style="margin:8px 0"><b>${hh(g.name)}</b> ${x.ok?'<span class="chip ok">🤖 memuat “jumlah” &amp; “sisi”</span>':'<span class="chip">🤔 belum memuat “jumlah” dan “sisi”</span>'}<p>“${hh(x.t)}”</p>${own?'<small>(jawaban kelompokmu)</small>':`<button class="btn sm go" data-v="1" data-g="${g.id}">👍 Benar${mine>0?' ✔':''}</button> <button class="btn sm pink" data-v="-1" data-g="${g.id}">👎 Kurang tepat${mine<0?' ✔':''}</button>`} <b>${vd}</b> (👍${up} 👎${dn})</div>`;}).join('')||'<p class="tiny">Belum ada jawaban yang dikirim.</p>';
    $('#drk').innerHTML=rankHTML(c);
  }
  grpBar($('#dgb'),()=>{const x=D()[ACT];$('#dtx').value=x?x.t:'';draw();});
  const x0=D()[ACT];if(x0)$('#dtx').value=x0.t;
  $('#dsend').onclick=()=>{
    const f=$('#dfb'),t=$('#dtx').value.trim();
    if(!ACT){f.className='fb bad';f.textContent='Pilih atau tambah kelompok dulu ya.';return;}
    if(t.length<8){f.className='fb bad';f.textContent='Tulis kesimpulanmu lebih lengkap ya ✏️';beep('bad');return;}
    const d=D(),had=d[ACT]||{},ok=auto(t);
    d[ACT]={t,ok,v:had.v||{},paid:had.paid,star:had.star};
    const first=ok&&!had.star;if(first)d[ACT].star=1;
    svJ(DK,d);if(first)grpAdd(1);
    f.className='fb ok';f.textContent=ok?'🎉 Terkirim! Jawabanmu memuat kata kunci.'+(first?' ⭐ +1 untuk kelompokmu!':''):'Terkirim. Coba cek lagi: apakah sudah menyebut “jumlah” dan “sisi”?';
    beep(ok?'ok':'tick');draw();
  };
  $('#dbd').onclick=e=>{
    const b=e.target.closest('[data-v]');if(!b||!ACT)return;
    const d=D(),x=d[b.dataset.g];if(!x)return;
    x.v=x.v||{};x.v[ACT]=+b.dataset.v;
    const up=Object.values(x.v).filter(z=>z>0).length;
    if(up>=2&&!x.paid){x.paid=1;svJ(DK,d);gupd(b.dataset.g,g=>{g.stars=(g.stars||0)+1});}else svJ(DK,d);
    beep('tick');draw();updTop();
  };
  draw();window._tm=setInterval(draw,1500);
}
 
/* ================= RUANG KELAS: peringkat & progres Peta Petualangan ================= */
const mapLv=()=>(gget()||{}).map||{};
function viewKelas(){
  view.innerHTML=`<div class="hero-t"><h2>👥 Ruang Kelas</h2><p class="lead">Pantau peringkat bintang dan sampai pulau mana tiap kelompok di Peta Petualangan Keliling. Cocok ditampilkan di infocus!</p></div>
  <div class="card" id="kgb"></div><div class="card"><h4>🏆 Peringkat Kelompok</h4><div id="krk"></div></div>
  <h3 style="margin:14px 0 4px">🗺️ Progres Petualangan Tiap Kelompok</h3><div class="mon" id="mon"></div>
  <div class="card"><button class="btn gray sm" id="kreset">🗑️ Hapus semua kelompok</button> <span class="tiny">Data tersimpan di peramban. Tab/jendela pada perangkat yang sama saling tersinkron; perangkat berbeda belum saling terhubung.</span></div>`;
  const done=g=>LV.filter(L=>g.map&&g.map[L.id]&&g.map[L.id].done);
  const draw=()=>{
    if(!$('#mon')){clearInterval(window._tm);return;}
    const c=loadC();$('#krk').innerHTML=rankHTML(c);
    $('#mon').innerHTML=c.length?[...c].sort((a,b)=>(b.stars||0)-(a.stars||0)||done(b).length-done(a).length).map((g,i)=>{
      const m=g.map||{},dn=done(g),d=dn.length,cur=g.cur,hi=d?Math.max(...dn.map(L=>L.id)):0,nx=LV.find(L=>!(m[L.id]&&m[L.id].done));
      const st=d===6?'🏆 Harta Karun ditemukan! Petualangan tamat':cur?`✍️ Sedang di ${LV[cur.id-1].emoji} ${LV[cur.id-1].name}: ${cur.s}/${cur.n} soal benar${cur.w?` · ❌ ${cur.w} salah`:''}`:d?`📍 Sudah sampai ${LV[hi-1].emoji} ${LV[hi-1].name} · berikutnya ${nx.name}`:'😴 Belum mulai';
      const pr=Math.min(1,(d+(cur&&!(m[cur.id]&&m[cur.id].done)?cur.s/cur.n:0))/6);
      return `<div class="card mcard"><b>${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${hh(g.name)}</b> <span class="chip">⭐ ${g.stars||0}</span>
      <div class="chips" style="margin:8px 0">${LV.map(L=>{const x=m[L.id];return `<span class="chip ${x&&x.done?'ok':cur&&cur.id===L.id?'on':''}" title="${L.name}">${x&&x.done?L.emoji+'⭐'.repeat(x.stars||0):cur&&cur.id===L.id?L.emoji+'…':'🔒'}</span>`;}).join('')}</div>
      <div class="pbar"><i style="width:${pr*100}%"></i></div><p style="margin:6px 0"><b>${st}</b></p><small>Pulau selesai: ${d} / 6</small></div>`;}).join(''):'<p class="lead">Belum ada kelompok. Tambahkan di atas, lalu mulai di menu Petualangan.</p>';
  };
  grpBar($('#kgb'),draw);draw();window._tm=setInterval(draw,1000);
  $('#kreset').onclick=function(){if(this.dataset.s!=='1'){this.dataset.s='1';this.textContent='Yakin? Klik sekali lagi';return;}try{localStorage.removeItem(CK);localStorage.removeItem(DK);}catch(e){}ACT=null;try{sessionStorage.removeItem('geofun_act')}catch(e){}updTop();viewKelas();};
}
 
/* ================= ROUTER & INISIALISASI ================= */
const TITLES={home:'Beranda',pertemuan:'Jalur Pertemuan',p:'Pertemuan',peta:'Peta Petualangan',jalan:'Jalan Keliling',tusuk:'Lab Tusuk Gigi',materi:'Buku Materi',kelas:'Ruang Kelas',petalama:'Peta Lama'};
function updTop(){const gg=gget();$('#starsPill').textContent=gg?'👥 '+gg.name+' ⭐'+(gg.stars||0):'⭐ '+totalStars();$('#sndBtn').textContent=S.muted?'🔇':'🔊';$('#guruBtn').classList.toggle('on',S.guru);document.body.classList.toggle('guru',S.guru);}
function toggleGuru(){S.guru=!S.guru;save();updTop();say(S.guru?'Mode Guru aktif: kunci jawaban dan catatan guru terlihat 🧑‍🏫':'Mode Guru dimatikan.');if(document.body.dataset.route==='peta')viewPeta();}
function route(){
  if(JSTOP){JSTOP();JSTOP=null;}clearInterval(window._tm);clearInterval(window._qt);if(window._rc)window._rc();
  const h=(location.hash||'#/cover').replace(/^#\/?/,''),[r,a]=h.split('/');
  const name=['cover','home','pertemuan','p','peta','petalama','kelas','jalan','tusuk','materi'].includes(r)?r:'cover';
  document.body.dataset.route=name;$$('.modal').forEach(m=>m.remove());
  $('#ttl').textContent=TITLES[name]||'';
  $$('.dock a').forEach(x=>x.classList.toggle('on',x.dataset.r===(name==='p'?'pertemuan':name)));
  const V={cover:viewCover,home:viewHome,pertemuan:viewList,p:()=>viewPertemuan(Math.min(5,Math.max(1,+a||1))),peta:viewPeta,kelas:viewKelas,jalan:()=>viewJalan(+a||0),tusuk:()=>viewTusuk(+a||0),materi:viewMateri};
  V[name]();window.scrollTo(0,0);updTop();
  const tips=TIPS[name==='p'?'pertemuan':name];if(tips&&name!=='p'&&name!=='jalan')setTimeout(()=>say(rnd(tips)),700);
}
$('#brand').onclick=()=>{location.hash='#/home';};
$('#sndBtn').onclick=()=>{S.muted=!S.muted;save();updTop();};
$('#guruBtn').onclick=toggleGuru;
$('#starsPill').onclick=()=>{location.hash='#/kelas';};
window.addEventListener('hashchange',route);
route();
</script>
